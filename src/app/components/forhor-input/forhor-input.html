<div class="forhor-input-container">
  <mat-form-field appearance="outline" class="input-field">
    <mat-label>Sök i förhör...</mat-label>
    <input
      matInput
      [formControl]="promptControl"
      (keypress)="onKeyPress($event)"
      [disabled]="loading()"
    />
  </mat-form-field>

  <button
    mat-fab
    color="primary"
    (click)="onSubmit()"
    [disabled]="loading() || !promptControl.value?.trim()"
    class="send-button"
    matTooltip="Skicka (Enter)"
  >
    <mat-icon>search</mat-icon>
  </button>
  
  @if (bestChunks().length > 0) {
    <div class="best-chunks">
      <h3>Relevanta utdrag:</h3>
      <ul>
        @for (chunk of bestChunks(); track chunk.chunk) {
          <li (mouseenter)="forhorService.setHoverChunk(chunk)"
              (mouseleave)="forhorService.setHoverChunk(null)">
            {{ chunk.chunk }}</li>
        }
      </ul>
    </div>
  }<div>

  </div>
</div>
